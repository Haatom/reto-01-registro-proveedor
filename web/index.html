<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente de Registro como Proveedor — Periferia IT</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242736;
      --border: #2e3146;
      --text: #e4e6f0;
      --text-secondary: #9ca0b4;
      --accent: #6c63ff;
      --accent-light: #8b84ff;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --tool-bg: #1e2235;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    header .badge {
      background: var(--accent);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: auto;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.assistant pre {
      background: var(--bg);
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      margin: 8px 0;
    }

    .message.assistant table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 13px;
    }

    .message.assistant th, .message.assistant td {
      text-align: left;
      padding: 6px 10px;
      border: 1px solid var(--border);
    }

    .message.assistant th {
      background: var(--surface2);
      font-weight: 600;
    }

    .tool-call {
      background: var(--tool-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 6px 0;
      font-size: 12px;
      max-width: 85%;
      align-self: flex-start;
    }

    .tool-call .tool-name {
      color: var(--accent-light);
      font-weight: 600;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }

    .tool-call .tool-args {
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .tool-call .tool-result {
      color: var(--green);
      margin-top: 4px;
      font-size: 11px;
    }

    .tool-call .tool-result.error {
      color: var(--red);
    }

    .confirmation-banner {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid var(--yellow);
      border-radius: 12px;
      padding: 12px 18px;
      margin: 8px 0;
      max-width: 85%;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .confirmation-banner .icon {
      font-size: 20px;
    }

    .thinking {
      align-self: flex-start;
      display: flex;
      gap: 6px;
      padding: 16px 20px;
    }

    .thinking span {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 12px;
    }

    #message-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    #message-input:focus {
      border-color: var(--accent);
    }

    #message-input::placeholder {
      color: var(--text-secondary);
    }

    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover { background: var(--accent-light); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0;
      align-self: center;
    }

    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      background: rgba(108, 99, 255, 0.1);
    }

    /* Markdown-like rendering */
    .message.assistant h3 { margin: 10px 0 6px; font-size: 14px; }
    .message.assistant strong { color: var(--accent-light); }
    .message.assistant ul, .message.assistant ol { padding-left: 20px; margin: 4px 0; }
    .message.assistant p { margin: 6px 0; }
    .message.assistant code {
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Cascadia Code', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">📋</div>
    <h1>Agente de Registro como Proveedor</h1>
    <span class="badge" id="status-badge">Conectando...</span>
  </header>

  <div id="chat-container">
    <div class="quick-actions">
      <button class="quick-btn" onclick="sendQuick('Procesa el caso &quot;co-industrias-delta&quot;. Dime qué campos quedaron llenos, cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar.')">
        🇨🇴 co-industrias-delta
      </button>
      <button class="quick-btn" onclick="sendQuick('Procesa el caso &quot;ec-corp-andina&quot;. Dime qué campos quedaron llenos, cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar. No envíes nada todavía.')">
        🇪🇨 ec-corp-andina
      </button>
      <button class="quick-btn" onclick="sendQuick('Procesa el caso &quot;hn-agroexport-sula&quot;')">
        🇭🇳 hn-agroexport-sula
      </button>
      <button class="quick-btn" onclick="sendQuick('Procesa el caso &quot;pa-logistica-istmo&quot;')">
        🇵🇦 pa-logistica-istmo
      </button>
    </div>
  </div>

  <div id="input-area">
    <input type="text" id="message-input" placeholder="Escribe un mensaje... (ej: Procesa el caso co-industrias-delta)" />
    <button id="send-btn" onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let sessionId = crypto.randomUUID();
    let isProcessing = false;

    // Check health
    fetch(`${API_BASE}/api/health`)
      .then(r => r.json())
      .then(d => {
        document.getElementById('status-badge').textContent = d.ok ? `${d.provider}/${d.model}` : 'Error';
        document.getElementById('status-badge').style.background = d.ok ? '#34d399' : '#f87171';
      })
      .catch(() => {
        document.getElementById('status-badge').textContent = 'Sin conexión';
        document.getElementById('status-badge').style.background = '#f87171';
      });

    function sendQuick(msg) {
      document.getElementById('message-input').value = msg;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const msg = input.value.trim();
      if (!msg || isProcessing) return;

      isProcessing = true;
      input.value = '';
      document.getElementById('send-btn').disabled = true;

      // Remove quick actions
      document.querySelectorAll('.quick-actions').forEach(el => el.remove());

      addMessage(msg, 'user');
      const thinkingEl = showThinking();

      try {
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: msg }),
        });

        const data = await res.json();
        thinkingEl.remove();

        if (data.error) {
          addMessage(`Error: ${data.error}`, 'assistant');
        } else {
          // Show tool calls
          if (data.toolCalls && data.toolCalls.length > 0) {
            for (const tc of data.toolCalls) {
              addToolCall(tc);
            }
          }

          // Show reply
          if (data.reply) {
            addMessage(data.reply, 'assistant');
          }

          // Show confirmation banner
          if (data.needsConfirmation) {
            addConfirmationBanner();
          }
        }
      } catch (e) {
        thinkingEl.remove();
        addMessage(`Error de conexión: ${e.message}`, 'assistant');
      }

      isProcessing = false;
      document.getElementById('send-btn').disabled = false;
      input.focus();
    }

    function addMessage(text, role) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = role === 'assistant' ? renderMarkdown(text) : escapeHtml(text);
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function addToolCall(tc) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'tool-call';

      const isOk = tc.result.includes('"ok":true') || tc.result.includes('"ok": true');
      div.innerHTML = `
        <div class="tool-name">🔧 ${escapeHtml(tc.name)}</div>
        <div class="tool-args">${escapeHtml(JSON.stringify(tc.args, null, 0))}</div>
        <div class="tool-result ${isOk ? '' : 'error'}">${isOk ? '✅' : '❌'} ${escapeHtml(truncate(tc.result, 200))}</div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function addConfirmationBanner() {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'confirmation-banner';
      div.innerHTML = `<span class="icon">⚠️</span><span>El agente espera tu confirmación antes de proceder.</span>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function showThinking() {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'thinking';
      div.innerHTML = '<span></span><span></span><span></span>';
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function renderMarkdown(text) {
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^### (.*$)/gm, '<h3>$1</h3>')
        .replace(/^- (.*$)/gm, '<li>$1</li>')
        .replace(/\n{2,}/g, '</p><p>')
        .replace(/\n/g, '<br>')
        .replace(/^/, '<p>').replace(/$/, '</p>')
        .replace(/\|(.+)\|/g, (match) => {
          const cells = match.split('|').filter(c => c.trim());
          if (cells.some(c => /^[-:]+$/.test(c.trim()))) return '';
          const tag = match.includes('---') ? 'th' : 'td';
          return '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
        });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function truncate(str, len) {
      return str.length > len ? str.slice(0, len) + '...' : str;
    }

    // Enter to send
    document.getElementById('message-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
